# ينزّل صور أكلات تطبيق المطبخ من ويكيميديا كومنز (يعمل تلقائياً عند تغيير قائمة البحث أو الاختيار)
name: matbakh-images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "matbakh/tools/images.json"
      - "matbakh/tools/picks.json"
      - "matbakh/tools/fetch_images.py"
permissions:
  contents: write
concurrency: matbakh-images
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 matbakh/tools/fetch_images.py
      - name: Save images
        run: |
          git config user.name "matbakh-bot"
          git config user.email "matbakh-bot@users.noreply.github.com"
          git add matbakh/img matbakh/credits.json matbakh/tools/candidates matbakh/tools/candidates.json
          git diff --cached --quiet || git commit -m "المطبخ: تحديث صور الأكلات"
          git pull --rebase origin main && git push
