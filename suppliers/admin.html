    </section>
    <section id="tab-stats" hidden></section>
  </main>
</div>

// one key for a phone however it is written: 0501234567 = +966 50 123 4567 = 00966501234567 = (13) 835-2391
function phoneKey(p) {
  let d = String(p == null ? '' : p).replace(/ext.*$/i, '').replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('966')) d = d.slice(3);

  if (d.length === 8 && /^[2-7]/.test(d)) d = '1' + d;   // landline written without its leading 1, e.g. (3) 835-2391

}

function normText(s) {

function dice(a, b) {
  if (!a || !b) return 0;
  if (a === b) return 1;
  const grams = s => { const m = {}; for (let i = 0; i < s.length - 1; i++) { const g = s.slice(i, i + 2); m[g] = (m[g] || 0) + 1; } return m; };
  const A = grams(a), B = grams(b); let inter = 0, na = 0, nb = 0;
  Object.keys(A).forEach(g => { na += A[g]; if (B[g]) inter += Math.min(A[g], B[g]); });
  Object.keys(B).forEach(g => { nb += B[g]; });
  return na + nb ? (2 * inter) / (na + nb) : 0;
}

function findDuplicate(cand, list, skipId) {
  const c = supplierKeys(cand);
  let likely = null;
  for (const s of list) {
    if (!s || s.ID === skipId) continue;
    const k = s._keys || (s._keys = supplierKeys(s));
    const p = c.phones.find(x => k.phones.includes(x));
    if (p) return {item: s, level: 'same', why: 'phone'};
    if (c.emails.find(x => k.emails.includes(x))) return {item: s, level: 'same', why: 'email'};
    if (c.name.length >= 3 && (c.name === k.name || c.name === k.nameAr)) return {item: s, level: 'same', why: 'name'};
    if (c.nameAr.length >= 3 && (c.nameAr === k.name || c.nameAr === k.nameAr)) return {item: s, level: 'same', why: 'name'};
    if (!likely) {
      const dom = c.emails.map(e => e.split('@')[1]).find(d => !FREE_MAIL.test('@' + d) && k.emails.some(e => e.endsWith('@' + d)));
      if (dom) likely = {item: s, level: 'likely', why: 'domain'};
      else if (c.name.length >= 5 && k.name.length >= 5 && dice(c.name, k.name) >= 0.85) likely = {item: s, level: 'likely', why: 'similar_name'};
      else if (c.name && k.name && Math.min(c.name.length, k.name.length) >= 4 && (c.name.startsWith(k.name) || k.name.startsWith(c.name))) likely = {item: s, level: 'likely', why: 'similar_name'};

}

    if (add.length) out[f] = joinList(have.concat(add));

  const custom = [...editing.cats].filter(c => !known.has(c));
  el.innerHTML = TAXONOMY.map(g => `<div class="pg"><div class="pg-h">${esc(g.ar)}</div><div class="pg-c"><button type="button" class="pc" data-ecat="@${g.id}" aria-pressed="${editing.cats.has('@' + g.id)}">${g.con ? 'مقاول' : 'القسم كله'}</button>${g.cats.map(c =>
    `<button type="button" class="pc" data-ecat="${esc(c[0])}" aria-pressed="${editing.cats.has(c[0])}">${esc(c[2])}</button>`).join('')}</div></div>`).join('')
    + (custom.length ? `<div class="pg"><div class="pg-h">تخصصات كتبها العضو</div><div class="pg-c">${custom.map(c => `<button type="button" class="pc" data-ecat="${esc(c)}" aria-pressed="true">${esc(c)} ✕</button>`).join('')}</div></div>` : '');
}
document.addEventListener('submit', async e => {
  if (e.target.id !== 'edit-form') return;
  e.preventDefault();
  const mode = e.submitter ? e.submitter.dataset.mode : 'edit';
  const data = {}; FIELDS.forEach(([k]) => data[k] = $('#e-' + k).value.trim()); data.Category = [...editing.cats];
  e.submitter && (e.submitter.disabled = true);
  if (mode === 'add' && (!data.Name || !(data.Mobiles || data.Phones || data.Emails))) { e.submitter && (e.submitter.disabled = false); return toast('اكتب الاسم ورقماً أو إيميلاً'); }
  const r = await api(mode, {sheet:'Suppliers', id:editing.id, data});
  if (!r.ok) { e.submitter && (e.submitter.disabled = false); return toast(errText(r)); }
  toast(mode === 'add' ? (r.status === 'new' ? 'تمت الإضافة والنشر ✅' : r.status === 'exists' ? 'موجود مسبقاً: ' + r.existing : 'كان موجوداً، أضفنا المعلومات الجديدة لبطاقة ' + r.existing + ' ✅')
    : mode === 'edit_approve' ? 'تم الحفظ والموافقة ✅' : 'تم الحفظ ✅');
  editing = null; closeEdit(); refresh();
});

/* ---------- requests ---------- */
function renderRequests(){
  const rq = DATA.requests;
  $('#tab-requests').innerHTML = rq.length ? rq.map(r => `<div class="card" id="c-${esc(r.ID)}">
      <h3>${esc(r.Text)}</h3>
      <div class="sub">${esc([r.City, r.Name, r.Date].filter(Boolean).join(' · '))}</div>
      ${r.Phone && tel(r.Phone) ? `<p class="sub">رقم صاحب الطلب: <a class="num" href="https://wa.me/${tel(r.Phone)}" target="_blank" rel="noopener">${esc(r.Phone)}</a></p>` : ''}
      <div class="acts">
        <button class="btn" data-act="close" data-sheet="Requests" data-id="${esc(r.ID)}">✔️ تم الرد</button>
        <button class="btn no" data-act="reject" data-sheet="Requests" data-id="${esc(r.ID)}">🙈 إخفاء</button>
      </div></div>`).join('') : `<div class="empty">لا توجد طلبات مفتوحة.</div>`;
}

/* ---------- all suppliers ---------- */
const norm = s => String(s||'').toLowerCase().replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
// possible duplicates among published suppliers (admin decides)
let notDup = new Set(); try { notDup = new Set(JSON.parse(localStorage.getItem('not_dup') || '[]')); } catch(e){}
function dupPairs(){
  const live = DATA.suppliers.filter(s => s.Status === 'approved'), out = [];
  live.forEach((s, i) => { const r = findDuplicate(s, live.slice(0, i)); if (r && !notDup.has(r.item.ID + '|' + s.ID)) out.push({a: r.item, b: s, why: r.why}); });
  return out;
}
function renderDups(){
  const ps = dupPairs();
  $('#dups').innerHTML = ps.length ? `<details class="card"><summary><b>🔍 قد تكون مكررة (${ps.length})</b> <span class="sub">راجعها مرة واحدة</span></summary>
    ${ps.map(p => `<div class="row"><div><b>${esc(p.a.Name)}</b><span class="sub">و</span><b>${esc(p.b.Name)}</b><span class="sub">${p.why === 'domain' ? 'نفس نطاق الإيميل' : 'أسماء متشابهة'}</span></div>
      <div class="acts"><button class="btn ok" data-merge="${esc(p.b.ID)}" data-into="${esc(p.a.ID)}">🔗 ادمج</button><button class="btn ghost" data-notdup="${esc(p.a.ID + '|' + p.b.ID)}">ليست مكررة</button></div></div>`).join('')}</details>` : '';
}
function renderAll(){
  renderDups();
  const q = norm($('#q').value.trim());
  const list = DATA.suppliers.filter(s => !q || norm([s.Name, s.Name_AR, s.Category, s.Category_AR, s.City, s.Brands, s.Mobiles, s.ID].join(' ')).includes(q));
  $('#all-list').innerHTML = list.slice(0, 80).map(s => `<div class="row ${s.Status === 'deleted' ? 'del' : ''}" id="c-${esc(s.ID)}">
      <div><b>${esc(s.Name)} ${s.Status === 'deleted' ? '<span class="tag">محذوف</span>' : ''}</b><span class="sub">${esc([split(s.Category).slice(0, 2).map(c => CAT_INFO[c] ? CAT_INFO[c].sar : c).join('، '), s.City].filter(Boolean).join(' · '))}</span></div>
      <div class="acts">${s.Status === 'deleted'
        ? `<button class="btn" data-act="restore" data-sheet="Suppliers" data-id="${esc(s.ID)}">↩️ إرجاع</button>`
        : `<button class="btn ghost" data-edit-all="${esc(s.ID)}">✏️</button><button class="btn no" data-act="delete" data-sheet="Suppliers" data-id="${esc(s.ID)}" aria-label="حذف">🗑</button>`}</div>
    </div>`).join('') + (list.length > 80 ? `<div class="row sub">يظهر 80 من ${list.length} — اكتب في البحث لتضييق النتائج</div>` : '') ||
    `<div class="row sub">لا نتائج</div>`;
}
$('#q').addEventListener('input', renderAll);

/* ---------- usage numbers ---------- */
let statDays = 30;
const nf = n => Number(n || 0).toLocaleString('ar-SA');
async function loadStats(){
  const box = $('#tab-stats');
  box.innerHTML = '<div class="empty">جارٍ تحميل الأرقام…</div>';
  const r = await api('stats', {days: statDays});
  if (!r.ok) { box.innerHTML = `<div class="msg err">${esc(errText(r))}</div>`; return; }
  const T = r.totals || {}, days = r.days || [];
  const max = Math.max(1, ...days.map(d => d.visits));
  const secName = k => (TAXONOMY.find(g => g.id === k) || {}).ar || k;
  const bars = (list, label, sub) => list.length ? `<ul class="bars">${list.map(x => { const top = list[0].n || list[0].total || 1, n = x.n ?? x.total;
    return `<li><span>${label(x)}</span><b>${nf(n)}</b><i style="width:${Math.max(4, Math.round(n / top * 100))}%"></i>${sub ? `<small>${sub(x)}</small>` : ''}</li>`; }).join('')}</ul>` : '<div class="empty" style="padding:14px">لا توجد أرقام بعد</div>';
  const fmtD = d => { const [y, m, dd] = d.split('-'); return +dd + '/' + +m; };
  box.innerHTML = `
    <div class="seg">${[7, 30, 90].map(n => `<button data-sdays="${n}" aria-pressed="${n === statDays}">آخر ${n} يوم</button>`).join('')}</div>
    <div class="kpis">
      <div class="kpi"><b>${nf(T.visits)}</b><span>زيارة</span><small>آخر 7 أيام: ${nf(T.visits7)}</small></div>
      <div class="kpi"><b>${nf(T.contacts)}</b><span>اتصال وواتساب للموردين</span><small>آخر 7 أيام: ${nf(T.contacts7)}</small></div>
      <div class="kpi"><b>${nf(T.searches)}</b><span>عملية بحث</span><small>آخر 7 أيام: ${nf(T.searches7)}</small></div>
      <div class="kpi"><b>${nf(T.shares)}</b><span>مشاركة بطاقة مورد</span><small>فتح بطاقة: ${nf(T.opens)}</small></div>
    </div>
    <div class="card"><h3>الزوار كل يوم</h3>
      <div class="days" role="img" aria-label="عدد الزوار كل يوم">${days.map(d => `<i class="${d.visits ? '' : 'z'}" style="height:${Math.round(d.visits / max * 100)}%" title="${esc(d.d)}: ${d.visits}"></i>`).join('')}</div>
      <div class="axis"><span>${days.length ? fmtD(days[0].d) : ''}</span><span>اليوم</span></div></div>
    <div class="card"><h3>أكثر الموردين تواصلاً</h3><p class="sub">ضغطات الاتصال والواتساب والمشاركة</p>
      ${bars(r.suppliers || [], x => esc(x.name), x => `اتصال ${nf(x.call)} · واتساب ${nf(x.wa)} · مشاركة ${nf(x.share)} · فتح ${nf(x.open)}`)}</div>
    <div class="card"><h3>أكثر ما بحث عنه الأعضاء</h3>${bars(r.search || [], x => esc(x.k))}</div>
    <div class="card"><h3>بحثوا ولم يجدوا نتيجة</h3><p class="sub">موردون ينقصون الدليل: اطلبهم من القروب</p>${bars(r.nores || [], x => esc(x.k))}</div>
    <div class="card"><h3>أكثر الأقسام فتحاً</h3>${bars(r.section || [], x => esc(secName(x.k)))}</div>
    <p class="note">«زيارة» = جهاز فتح الدليل في ذلك اليوم (الجهاز نفسه يُحسب مرة واحدة في اليوم). لا نحفظ أسماء الزوار ولا أرقامهم. بدأ العدّ في ${esc(r.since || 'اليوم')}.</p>`;
}

/* ---------- clicks ---------- */
const CONFIRM = {reject:'رفض هذا العنصر؟', delete:'حذف هذا المورد من الموقع؟ (يمكنك إرجاعه لاحقاً)'};
const DONE = {approve:'تمت الموافقة ✅', reject:'تم الرفض', delete:'تم الحذف', restore:'تم الإرجاع ✅', close:'تم إغلاق الطلب'};
document.addEventListener('click', async e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b === tab));
    ['pending','requests','all','stats'].forEach(n => $('#tab-' + n).hidden = n !== tab.dataset.tab);
    if (tab.dataset.tab === 'stats') loadStats(); return; }
  const sd = e.target.closest('[data-sdays]'); if (sd) { statDays = +sd.dataset.sdays; return loadStats(); }
  if (e.target.closest('#reload')) return refresh();
  if (e.target.closest('#cancel-edit')) { editing = null; closeEdit(); return refresh(); }
  const ec = e.target.closest('[data-ecat]'); if (ec && editing) { const k = ec.dataset.ecat; editing.cats.has(k) ? editing.cats.delete(k) : editing.cats.add(k); return renderEditCats(); }
  const bt = e.target.closest('[data-batch]'); if (bt) { if (!confirm('اعتماد القائمة كلها؟')) return; bt.disabled = true; const r = await api('approve_batch', {batch: bt.dataset.batch}); if (!r.ok) { bt.disabled = false; return toast(errText(r)); } toast('تم اعتماد ' + r.count + ' ✅'); return refresh(); }
  const mg = e.target.closest('[data-merge]'); if (mg) { if (!confirm('دمج هذا المورد في الموجود؟ تُضاف بياناته الجديدة لبطاقته.')) return; mg.disabled = true; const r = await api('merge', {id: mg.dataset.merge, into: mg.dataset.into}); if (!r.ok) { mg.disabled = false; return toast(errText(r)); } toast('تم الدمج ✅'); return refresh(); }
  if (e.target.closest('#export-all')) return exportAll();
  if (e.target.closest('#add-new')) return openEdit('', true);
  const nd = e.target.closest('[data-notdup]'); if (nd) { notDup.add(nd.dataset.notdup); try { localStorage.setItem('not_dup', JSON.stringify([...notDup])); } catch(e){} return renderDups(); }
  const ed = e.target.closest('[data-edit]'); if (ed) return openEdit(ed.dataset.edit, false);
  const ea = e.target.closest('[data-edit-all]'); if (ea) return openEdit(ea.dataset.editAll, true);
  const b = e.target.closest('[data-act]'); if (!b) return;
  const {act, sheet, id} = b.dataset;
  if (CONFIRM[act] && !confirm(CONFIRM[act])) return;
  b.disabled = true;
  const r = await api(act, {sheet, id});
  if (!r.ok) { b.disabled = false; return toast(errText(r)); }
  toast(DONE[act] || 'تم');
  const card = document.getElementById('c-' + id);
  if (act === 'approve' && sheet === 'Suppliers') {
    const s = DATA.pending.find(x => x.ID === id);
    const thanks = s && thankLink(s.Submitted_By, s.Submitter_Phone, s.Name);
    if (card && thanks) { card.innerHTML = `<h3>✅ ${esc(s.Name)}</h3><p class="sub">تمت الموافقة. أرسل شكراً للعضو ليتشجع أكثر:</p><div class="acts">${thanks}<button class="btn ghost" id="reload">التالي</button></div>`;
      DATA.pending = DATA.pending.filter(x => x.ID !== id); return; }
  }
  refresh();
});

let xlsxP = null;
function loadXLSX(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return xlsxP || (xlsxP = new Promise((ok, no) => { const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; sc.onload = () => ok(window.XLSX); sc.onerror = () => { xlsxP = null; no(); }; document.head.appendChild(sc); }));
}
async function exportAll(){
  const b = $('#export-all'); b.disabled = true;
  const r = await api('export'); if (!r.ok) { b.disabled = false; return toast(errText(r)); }
  let X; try { X = await loadXLSX(); } catch(e) { b.disabled = false; return toast('تعذّر تحميل مكتبة Excel'); }
  const cols = [['ID','الرقم'],['Name','اسم الشركة'],['Name_AR','الاسم بالعربي'],['Type','النوع'],['Category_AR','التخصصات'],['City','المدينة'],['Contacts','المسؤول'],
    ['Mobiles','الجوال'],['Phones','الهاتف'],['Fax','الفاكس'],['Emails','الإيميل'],['Brands','الماركات وأسماء أخرى'],['Specialty','التفاصيل'],['Address','العنوان'],['Notes','ملاحظات'],['Submitted_By','أضافه'],['Date','التاريخ']];
  const rows = r.suppliers.map(s => cols.map(([k]) => String(s[k] || '').replace(/ ; /g, ' / ')));
  const ws = X.utils.aoa_to_sheet([['دليل موردي الكهرباء – قروب Elec in KSA · نسخة كاملة ' + new Date().toISOString().slice(0, 10)], [], cols.map(c => c[1])].concat(rows));
  ws['!cols'] = cols.map(() => ({wch: 22})); ws['!views'] = [{RTL: true}];
  const wb = X.utils.book_new(); wb.Workbook = {Views: [{RTL: true}]}; X.utils.book_append_sheet(wb, ws, 'Suppliers');
  X.writeFile(wb, 'Elec-in-KSA-all-suppliers-' + new Date().toISOString().slice(0, 10) + '.xlsx');
  b.disabled = false; toast('تم تجهيز الملف ✅ (' + rows.length + ' شركة)');
}

if (PASS) api('load').then(r => { if (r.ok) start(r); else { try { localStorage.removeItem('admin_pass'); } catch(e){} } });
})();
</script>
